
;;;;;;;;;;;;
; JwtAuth  ;
;;;;;;;;;;;;

; jwtauth.secret
; Secret key for signing JWTs. Must be set; never leave empty in production.
; Can also be provided via the JWT_SECRET environment variable.
jwtauth.secret = ""

; jwtauth.allowed_origins
; Comma-separated list of origins allowed for CORS with credentials.
; Can also be provided via the JWT_ALLOWED_ORIGINS environment variable.
; Defaults to localhost dev origins when unset.
; jwtauth.allowed_origins = "https://archive.example.com"
